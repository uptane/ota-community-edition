server {
    error_log  /var/log/nginx/error.log info;
    listen       8443 ssl;
    server_name ota.ce;
    ssl_certificate     /etc/ssl/gateway/server.chain.pem;
    ssl_certificate_key /etc/ssl/gateway/server.key;
    ssl_verify_client on;
    ssl_verify_depth 10;
    ssl_client_certificate /etc/ssl/gateway/ca.crt;

    if ($ssl_client_s_dn ~ "CN=(.*)$") {
        set $deviceUuid $1;
    }
    if ($ssl_client_s_dn !~ "CN=(.*)$") {
        set $deviceUuid $ssl_client_s_dn;
    }
    set $deviceNamespace "default";


    # TODO: use proxying through traefik/nginx instea of port numbers 

    location /treehub/ {
        rewrite ^/treehub/(.*)$ /api/v2/$1 break;
        proxy_set_header x-ats-device-uuid $deviceUuid;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7400;
    }

    location /director/ {
        rewrite ^/director/(.*)$ /api/v1/device/${deviceUuid}/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Host director.ota.ce;
        proxy_pass http://reverse-proxy;
    }

    location /repo/ {
        rewrite ^/repo/(.*)$ /api/v1/user_repo/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7100;
    }

    # device-registry is part of director since v3: its API is served by
    # director (port 7300) under the /device-registry prefix.
    # aktualizr also calls /system_info and /events without a trailing slash;
    # the exact-match locations keep nginx from answering those with a 301
    # redirect to its internal port.

    location = /system_info {
        rewrite ^ /device-registry/api/v1/devices/$deviceUuid/system_info break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }

    location /system_info/ {
        rewrite ^/system_info/(.*)$ /device-registry/api/v1/devices/$deviceUuid/system_info/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }

    location /core/ {
        rewrite ^/core/(.*)$ /device-registry/api/v1/mydevice/$deviceUuid/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }

    location /core/installed {
        rewrite ^/core/(.*)$ /device-registry/api/v1/mydevice/$deviceUuid/packages break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }

    location = /events {
        rewrite ^ /device-registry/api/v1/devices/$deviceUuid/events break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }

    location /events/ {
        rewrite ^/events/(.*)$ /device-registry/api/v1/devices/$deviceUuid/events/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_pass http://ota-lith:7300;
    }
}
