
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

	log_format json_rich_format escape=json '{"time":"$time_iso8601","request_method":"$request_method","uri":"$uri","http_user_agent":"$http_user_agent","client_addr":"$remote_addr","scheme":"$scheme","host":"$host","status":$status,"request_time":"$request_time","http_content_type":"$sent_http_content_type"}';
	access_log /var/log/nginx/access.log json_rich_format;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}